services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentscreen-postgres
    restart: unless-stopped
    ports:
      # Bind exclusively to 127.0.0.1 (loopback) to prevent accidental LAN exposure
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talentscreen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentscreen"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
